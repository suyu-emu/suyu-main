name: Android Nightly

# Put this file at .github/workflows/nightly-android.yml on your default branch.
# Enable Actions in your fork. Uses GITHUB_TOKEN; no personal token is needed.
# Builds YOUR repository as it stands; it does not sync changes from upstream.
# The daily trigger only starts a build every third UTC calendar day, avoiding
# cron's */3 day-of-month reset. Manual runs always build immediately.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-nightly-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  schedule:
    name: Check three-day interval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check schedule
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || (( day % 3 == 0 )); then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Next nightly: the next UTC day divisible by three.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build Android ARM64 APK
    needs: schedule
    if: needs.schedule.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare version
        id: meta
        run: |
          commit=$(git rev-parse HEAD)
          version="nightly-$(date -u +%Y%m%d)-${commit:0:8}"
          tag="${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "GIT_TAG_NAME=$version" >> "$GITHUB_ENV"

      - name: Initialize required submodules
        run: |
          git submodule sync --recursive
          git -c submodule."externals/nxdumptool".update=none \
              -c submodule."externals/nxapi".update=none \
              -c submodule."externals/nx-optimizer".update=none \
              submodule update --init --recursive --depth=1 --jobs=2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact SDK and native build tools
        run: |
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.31.6'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslang-tools pkg-config nasm autoconf automake libtool
          df -h .

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Compatibility repairs for the inspected mk8-recomp source tree.
      # These affect the CI checkout only; no commits are pushed to your repo.
      - name: Repair known upstream build configuration issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Compose Compiler 1.5.14 requires Kotlin 1.9.24, while this tree
          # declares 1.9.20. Leave other/newer version combinations untouched.
          app = Path('src/android/app/build.gradle.kts')
          if 'kotlinCompilerExtensionVersion = "1.5.14"' in app.read_text():
              replacements = {
                  Path('src/android/build.gradle.kts'): (
                      'id("org.jetbrains.kotlin.android") version "1.9.20"',
                      'id("org.jetbrains.kotlin.android") version "1.9.24"',
                  ),
                  app: (
                      'kotlin("plugin.serialization") version "1.9.20"',
                      'kotlin("plugin.serialization") version "1.9.24"',
                  ),
              }
              for path, (old, new) in replacements.items():
                  original = path.read_text()
                  if old in original:
                      path.write_text(original.replace(old, new))
                      print(f'Updated Kotlin to 1.9.24 in {path}')

          # Same conditional workaround used by upstream release.yml for
          # a retained Windows forwarding header in the Dynarmic submodule.
          header = Path('externals/dynarmic/externals/mcl/include/boost/variant.hpp')
          if header.is_file() and 'C:/Users' in header.read_text():
              includes = (
                  'variant', 'recursive_variant', 'recursive_wrapper', 'get',
                  'apply_visitor', 'static_visitor', 'visitor_ptr',
              )
              header.write_text('// Forwarding header\n' + ''.join(
                  f'#include <boost/variant/{name}.hpp>\n' for name in includes
              ))
              print('Repaired Dynarmic Boost forwarding header')
          PY

      - name: Build signed Mainline Nightly APK
        working-directory: src/android
        run: |
          # This stable, repository-provided test key permits installing
          # successive nightlies as updates. No random key is generated.
          test -f app/debug.keystore
          chmod +x gradlew
          ./gradlew :app:assembleMainlineRelease \
            -Pnightly=true \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            --no-daemon --no-parallel --max-workers=2 --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/android-nightly-build.log"

      - name: Verify and package APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          apk=src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p nightly-output
          cp "$apk" "nightly-output/suyu-${VERSION}-arm64-v8a.apk"
          (cd nightly-output && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload APK for release job
        uses: actions/upload-artifact@v4
        with:
          name: android-nightly
          path: nightly-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-nightly-build-log
          path: ${{ runner.temp }}/android-nightly-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish nightly prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: android-nightly
          path: nightly-output

      - name: Publish on this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd nightly-output && sha256sum -c SHA256SUMS.txt)
          notes="$RUNNER_TEMP/nightly-notes.md"
          {
            printf 'Automated Android ARM64 nightly build.\n\n'
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Source commit: [%s](https://github.com/%s/commit/%s)\n' "$COMMIT" "$GH_REPO" "$COMMIT"
            printf -- '- Build: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$GITHUB_RUN_ID"
            printf -- '- Android 8.0 or newer; arm64-v8a.\n'
            printf -- '- Mainline Release with the Nightly application suffix.\n'
            printf -- '- Signed with the repository-provided test key.\n'
            printf -- '- CI applies the conditional Kotlin/Compose and Dynarmic header fixes documented in the workflow.\n\n'
            printf 'Experimental build. Download the APK below; SHA256SUMS.txt contains its checksum.\n'
          } > "$notes"
          # Upload as a draft first so a failed upload does not expose a
          # partially populated release. Each run gets its own immutable tag.
          gh release create "$TAG" nightly-output/* \
            --repo "$GH_REPO" --target "$COMMIT" \
            --title "Android Nightly — $VERSION" \
            --notes-file "$notes" --draft --prerelease --latest=false
          gh release edit "$TAG" --repo "$GH_REPO" \
            --draft=false --prerelease --latest=false
          printf '### Nightly published\n\nhttps://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$TAG" >> "$GITHUB_STEP_SUMMARY"
          
